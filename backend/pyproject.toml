[project]
name = "orcatrading-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "SQLAlchemy>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "psycopg2-binary (>=2.9.11,<3.0.0)",
  "itsdangerous>=2.1",
  "authlib>=1.3",
  "pyjwt>=2.8",
  "stripe>=9.0",
  "torch>=2.0.0",
  "einops>=0.7.0",
  "huggingface_hub>=0.20.0",
  "safetensors>=0.4.0",
  "numpy>=1.24.0",
  "pandas>=2.0.0",
]

[tool.uvicorn]
factory = false
host = "0.0.0.0"
port = 8000

